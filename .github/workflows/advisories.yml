# Checks the locked Rust dependencies against the RustSec advisory database every day, so an advisory published after
# a pull request was merged is noticed without waiting for the next one. The npm package has no dependencies (enforced
# by `xtask repo-check`), so there is nothing for `npm audit` to check.

name: Advisories

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rustsec:
    name: cargo deny check advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories
