[workspace]
resolver = "3"
members = ["crates/rootcard", "crates/rootcard-cli", "crates/rootcard-host", "crates/xtask"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
repository = "https://github.com/Hexagon/rootcard"
homepage = "https://github.com/Hexagon/rootcard"
# License: pending decision D1 (docs/PLAN.md). Proposal: "MIT OR Apache-2.0".
# Crates stay `publish = false` until it is decided.
publish = false

[workspace.dependencies]
rootcard = { path = "crates/rootcard", version = "0.0.0" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
