[package]
name = "xtask"
description = "Repository tasks: test vectors and release checks (not published)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
rootcard = { workspace = true, features = ["vault"] }
# Only for constructing the rejected signature classes of SPEC [CRY-3] in the vectors.
curve25519-dalek = { version = "5.0.0", default-features = false, features = ["alloc", "precomputed-tables"] }
sha2 = { version = "0.11.1", default-features = false }
zeroize = { version = "1.9.1", default-features = false }

[lints]
workspace = true
