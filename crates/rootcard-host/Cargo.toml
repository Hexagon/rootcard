[package]
name = "rootcard-host"
description = "Host-side helpers for rootcard identities: challenges, identity stores and request handlers"
keywords = ["identity", "authentication", "login", "server"]
categories = ["authentication"]
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true

[dependencies]
# The verification core only: no Argon2id, X25519, AES-GCM or Unicode normalization (ARCHITECTURE.md §4).
rootcard = { workspace = true }
zeroize = { version = "1.9.1", default-features = false }

[dev-dependencies]
rootcard = { workspace = true, features = ["vault"] }

[lints]
workspace = true
