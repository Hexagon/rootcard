[package]
name = "rootcard-cli"
description = "The rootcard key tool: recovery-key operations for rootcard identities"
keywords = ["identity", "authentication", "cli", "recovery"]
categories = ["authentication", "command-line-utilities"]
readme = "README.md"
include = ["src/**/*.rs", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true

[[bin]]
name = "rootcard"
path = "src/main.rs"

[dependencies]
getrandom = "0.4.3"
rootcard = { workspace = true, features = ["vault"] }
rpassword = "7"
ureq = { version = "3.5.1", default-features = false, features = ["rustls"] }
zeroize = "1.9.1"

[lints]
workspace = true
